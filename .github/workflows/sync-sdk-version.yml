name: Sync default SDK version from Turboism release

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to track (stable or beta)
        type: choice
        options: [stable, beta]
        default: stable
        required: false
      tag:
        description: Optional explicit Turboism release tag (e.g. v0.67.4)
        type: string
        default: ''
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sdk-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out template repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Turboism release metadata
        id: resolve
        env:
          INPUT_CHANNEL: ${{ inputs.channel || 'stable' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          channel = os.environ.get("INPUT_CHANNEL", "stable") or "stable"
          explicit_tag = os.environ.get("INPUT_TAG", "").strip()

          def fetch_json(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "turboism-plugin-template-sync/2",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def parse_compat_from_body(body: str) -> list[str]:
              m = re.search(r"<!-- turboism-compatibility-v1 ([\s\S]*?) -->", body or "")
              if not m:
                  return []
              try:
                  compat = json.loads(m.group(1))
                  ce = compat.get("cubismEditor", {})
                  raw = ce.get("versions") or []
                  return [str(v) for v in raw if re.fullmatch(r"5\.\d{1,2}\.\d{2}", str(v))]
              except Exception:
                  return []

          resolved_tag = ""
          compat_versions: list[str] = []

          if explicit_tag:
              if not explicit_tag.startswith("v"):
                  explicit_tag = "v" + explicit_tag
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", explicit_tag):
                  raise SystemExit(f"Invalid tag format: {explicit_tag}")
              resolved_tag = explicit_tag
              try:
                  rel = fetch_json(f"https://api.github.com/repos/turboism/Turboism/releases/tags/{resolved_tag}")
                  compat_versions = parse_compat_from_body(str(rel.get("body") or ""))
              except Exception:
                  pass
          else:
              try:
                  doc = fetch_json(f"https://api.turboism.dev/v1/releases/{channel}.json")
                  if isinstance(doc, dict) and doc.get("status") == "ready":
                      rel = doc.get("release") or {}
                      tag = str(rel.get("tag") or "")
                      if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag):
                          resolved_tag = tag
                          ce = (rel.get("compatibility") or {}).get("cubismEditor") or {}
                          compat_versions = [
                              str(v) for v in (ce.get("versions") or [])
                              if re.fullmatch(r"5\.\d{1,2}\.\d{2}", str(v))
                          ]
              except Exception:
                  pass
              if not resolved_tag:
                  releases = fetch_json("https://api.github.com/repos/turboism/Turboism/releases?per_page=30")
                  for item in releases if isinstance(releases, list) else []:
                      if not isinstance(item, dict) or item.get("draft") is True:
                          continue
                      tag = str(item.get("tag_name") or "")
                      if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag):
                          continue
                      ver = tag[1:]
                      is_pre = bool(item.get("prerelease"))
                      if (channel == "stable" and not is_pre and "-" not in ver) or (
                          channel == "beta" and is_pre and "-0.nightly." not in ver
                      ):
                          resolved_tag = tag
                          compat_versions = parse_compat_from_body(str(item.get("body") or ""))
                          break

          if not resolved_tag:
              raise SystemExit(f"No published Turboism release found for channel '{channel}'.")

          version = resolved_tag[1:]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={resolved_tag}\n")
              out.write(f"version={version}\n")
              out.write(f"compat_json={json.dumps(sorted(set(compat_versions), key=lambda v: tuple(int(x) for x in v.split('.'))))}\n")
          print(f"Resolved {resolved_tag} (compat versions: {len(compat_versions)})")
          PY

      - name: Update version metadata and open pull request if newer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.resolve.outputs.tag }}
          TARGET_VERSION: ${{ steps.resolve.outputs.version }}
          COMPAT_JSON: ${{ steps.resolve.outputs.compat_json }}
        run: |
          set -euo pipefail
          CURRENT="$(sed -n 's/^turboismSdkVersion=//p' gradle.properties | head -n 1)"
          if [[ -n "$CURRENT" && "$CURRENT" != *-SNAPSHOT ]] && python3 - "$CURRENT" "$TARGET_VERSION" <<'PY'
          import sys
          def key(v):
              core, _, pre = v.partition("-")
              nums = tuple(int(x) for x in core.split("."))
              parts = tuple((0, int(p), "") if p.isdigit() else (1, 0, p) for p in pre.split(".")) if pre else ()
              return nums, (0,) if pre else (1,), parts
          sys.exit(0 if key(sys.argv[1]) >= key(sys.argv[2]) else 1)
          PY
          then
            echo "Template already tracks ${CURRENT} (>= ${TARGET_VERSION}); nothing to update."
            exit 0
          fi

          BRANCH="chore/sync-sdk-${TARGET_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"

          python3 - "$TARGET_VERSION" "$COMPAT_JSON" <<'PY'
          import json
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          compat = json.loads(sys.argv[2])

          props_path = pathlib.Path("gradle.properties")
          text = props_path.read_text(encoding="utf-8")
          text = re.sub(r"(?m)^turboismSdkVersion=.*$", f"turboismSdkVersion={version}", text)
          props_path.write_text(text, encoding="utf-8")

          if compat:
              cv_path = pathlib.Path("src/main/resources/META-INF/turboism/cubism-versions.json")
              doc = json.loads(cv_path.read_text(encoding="utf-8"))
              doc["supportedVersions"] = compat
              doc["fullFeatureVersions"] = compat
              cv_path.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
          PY

          if git diff --quiet; then
            echo "No file changes required for ${TARGET_TAG}."
            exit 0
          fi

          git add gradle.properties src/main/resources/META-INF/turboism/cubism-versions.json
          git commit -m "chore: bump default Turboism SDK version to ${TARGET_VERSION}"
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"

          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: bump default Turboism SDK version to ${TARGET_VERSION}" \
              --body "Updates \`turboismSdkVersion\` in \`gradle.properties\` (and reviewed Cubism versions in \`cubism-versions.json\`) to match Turboism release \`${TARGET_TAG}\`."
          else
            echo "Pull request for ${BRANCH} is already open; branch updated."
          fi
